<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindBridge — {% block title %}{% endblock %}</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #07090f;
  --surface: #0d1117;
  --card:    #111827;
  --border:  #1f2937;
  --text:    #f1f5f9;
  --muted:   #6b7280;
  --purple:  #7c3aed;
  --purple2: #6d28d9;
  --blue:    #3b82f6;
  --accent:  #a78bfa;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(7,9,15,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700; color: var(--text);
  text-decoration: none;
}
.nav-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.nav-badge {
  font-size: 11px; color: var(--muted);
  border: 1px solid var(--border);
  padding: 2px 10px; border-radius: 20px;
}

.page { max-width: 760px; margin: 0 auto; padding: 48px 20px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
}

.progress-wrap { margin-bottom: 36px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: .06em;
}
.progress-track {
  height: 4px; background: var(--border); border-radius: 20px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 20px;
  background: linear-gradient(90deg, var(--purple), var(--accent));
  transition: width .4s ease;
}

.btn-primary {
  display: inline-block;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  color: #fff; font-size: 15px; font-weight: 600;
  padding: 14px 32px; border-radius: 10px;
  border: none; cursor: pointer; width: 100%;
  letter-spacing: .02em; transition: opacity .2s, transform .1s;
}
.btn-primary:hover  { opacity: .9; }
.btn-primary:active { transform: scale(.99); }

/* Home page styles */
.hero { text-align: center; padding: 80px 20px 60px; }
.hero-badge {
  display: inline-block;
  background: rgba(124,58,237,.15);
  border: 1px solid rgba(124,58,237,.3);
  color: var(--accent); font-size: 12px;
  padding: 5px 16px; border-radius: 20px;
  letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 24px;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 800; line-height: 1.1;
  letter-spacing: -.03em; margin-bottom: 18px;
}
.hero h1 span {
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero p {
  font-size: 17px; color: var(--muted);
  max-width: 520px; margin: 0 auto 40px; line-height: 1.7;
}
.stats {
  display: flex; justify-content: center; gap: 40px;
  margin-bottom: 56px; flex-wrap: wrap;
}
.stat-item { text-align: center; }
.stat-num  { font-size: 26px; font-weight: 700; color: var(--accent); }
.stat-lbl  { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.features  {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 16px; margin-bottom: 48px;
  max-width: 900px; margin-left: auto; margin-right: auto;
}
.feat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px 20px; text-align: center;
}
.feat-icon  { font-size: 28px; margin-bottom: 10px; }
.feat-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.feat-desc  { font-size: 12px; color: var(--muted); line-height: 1.5; }
.cta-wrap   { text-align: center; }
.disclaimer {
  margin-top: 20px; font-size: 12px; color: var(--muted);
  max-width: 480px; margin-left: auto; margin-right: auto; line-height: 1.6;
}

/* Question page styles */
.level-tag {
  display: inline-block;
  background: rgba(124,58,237,.15);
  border: 1px solid rgba(124,58,237,.3);
  color: var(--accent); font-size: 11px;
  padding: 4px 14px; border-radius: 20px;
  letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px;
}
.q-header { margin-bottom: 36px; }
.q-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.q-header p  { font-size: 14px; color: var(--muted); }
.question-block { margin-bottom: 28px; }
.q-number {
  font-size: 11px; color: var(--accent); font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px;
}
.q-text { font-size: 16px; font-weight: 500; margin-bottom: 14px; line-height: 1.5; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option-label {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 16px; cursor: pointer;
  transition: all .15s; font-size: 14px; color: #d1d5db;
}
.option-label:hover {
  border-color: var(--purple); color: var(--text);
  background: rgba(124,58,237,.08);
}
.option-label input[type="radio"] { display: none; }
.option-label input[type="radio"]:checked + .radio-dot {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(167,139,250,.25);
}
.option-label:has(input:checked) {
  border-color: var(--accent);
  background: rgba(124,58,237,.12);
  color: var(--text);
}
.radio-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0; transition: all .15s;
}
.divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

/* Level 2 path banner */
.path-banner {
  display: flex; align-items: center; gap: 12px;
  background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.25);
  border-radius: 10px; padding: 14px 18px; margin-bottom: 28px;
}
.path-icon { font-size: 22px; }
.path-info-title { font-size: 13px; font-weight: 600; color: var(--accent); }
.path-info-desc  { font-size: 12px; color: var(--muted); }

/* Result page styles */
.result-hero { text-align: center; margin-bottom: 32px; }
.result-icon { font-size: 52px; margin-bottom: 16px; }
.result-category { font-size: 28px; font-weight: 800; margin-bottom: 10px; letter-spacing: -.02em; }
.result-desc { font-size: 15px; color: var(--muted); max-width: 520px; margin: 0 auto; line-height: 1.7; }
.score-section { margin: 28px 0; }
.score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.score-label  { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.score-value  { font-size: 22px; font-weight: 700; }
.gauge-track  { height: 12px; background: var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 8px; }
.gauge-fill   { height: 100%; border-radius: 20px; transition: width 1.2s cubic-bezier(.4,0,.2,1); }
.gauge-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.urgent-box {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
  display: flex; gap: 12px; align-items: flex-start;
}
.urgent-icon { font-size: 20px; flex-shrink: 0; }
.urgent-text { font-size: 14px; color: #fca5a5; line-height: 1.6; }
.advice-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin-bottom: 14px;
}
.tip-card {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
}
.tip-num {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}
.tip-text { font-size: 14px; color: #d1d5db; line-height: 1.6; }
.action-row { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.btn-secondary {
  flex: 1; padding: 13px; background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center; text-decoration: none; display: block;
  transition: border-color .2s;
}
.btn-secondary:hover { border-color: var(--accent); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-dot"></div>
    MindBridge
  </a>
  <span class="nav-badge">Mental Health Assessment</span>
</nav>

{% block content %}{% endblock %}

</body>
</html>
